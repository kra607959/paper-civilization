<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸上文明 · 丹青纪</title>
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body class="game" data-era="1">
<canvas id="map" aria-label="纸面地图：族人在上面过日子；用三支笔写符、画线、照图纸盖房"></canvas>

<div class="hud hud-top">
  <div class="plate clock">
    <span class="era-seal" id="eraSeal" title="当前所处时代">部落</span>
    <span id="clock"></span>
    <span class="speeds" role="group" aria-label="时间速度">
      <button data-speed="0" title="暂停（空格）">停</button>
      <button data-speed="1">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="4">4×</button>
      <button data-speed="8">8×</button>
    </span>
  </div>
  <div class="plate stats" id="stats"></div>
  <div class="plate menu">
    <button id="era2Btn" class="primary" hidden title="迈入第二代农耕时代（彩陶）">迈入第二代</button>
    <button id="villageBtn" title="村务：农田、大渠、户籍、邻村（V）">村务</button>
    <button id="era3Btn" class="primary" hidden>迈入第三代</button>
    <button id="cityBtn" hidden title="城务、诸邦、书简与符谱（C）">城务</button>
    <button id="botBtn" title="让机器人替你当神：它写的符照样过识别器">托管</button>
    <button id="homeBtn" title="回营地（H）">回营地</button>
    <button id="newBtn" title="换一张纸重开">新纸</button>
    <a href="sandbox.html" title="M0：三支笔沙盘">沙盘</a>
    <a href="lab.html" title="符号实验室：练字、看识别器怎么想">实验室</a>
  </div>
</div>

<div class="hud plate chron" id="chron">
  <div class="row"><h3>编年</h3><span class="tabs"><button data-filter="big">大事</button><button data-filter="god">神迹</button><button data-filter="all">全部</button></span></div>
  <ol id="log"></ol>
</div>

<div class="hud plate who" id="who" hidden></div>
<div class="hud plate techp" id="tech" hidden></div>
<div class="hud plate villagep" id="village" hidden></div>
<div class="hud plate villagep cityp" id="city" hidden></div>

<div class="hud toast" id="toast" aria-live="polite"></div>
<div class="hud era-banner" id="eraBanner" hidden></div>

<div class="hud pens" id="pens">
  <button class="plate pen look" data-pen="look">
    <span class="ico-svg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></span>
    <span class="nm">看</span><span class="ds">挪图 · 点选 <kbd>Q</kbd></span>
  </button>
  <button class="plate pen pencil" data-pen="pencil">
    <span class="ico-svg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="M13.5 7.5l3 3"/></svg></span>
    <span class="nm">铅笔</span><span class="ds" id="pencilDs">探路 · 修路 <kbd>1</kbd></span>
  </button>
  <button class="plate pen ink" data-pen="ink">
    <span class="ico-svg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 4c2.5 0 4.5 2 4.5 4.5 0 2-1.2 3.5-2.5 5L11 19.5c-1.8 1.8-5.5 1.5-6.5.5 1-1 .7-4.7 2.5-6.5L13 7.5c.8-.9 1.5-3.5 2-3.5Z"/><path d="M6.5 17.5l3-3"/></svg></span>
    <span class="nm">墨笔</span><span class="ds">号令 · 神迹 <kbd>2</kbd></span>
  </button>
  <button class="plate pen red" data-pen="red">
    <span class="ico-svg" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg></span>
    <span class="nm">朱笔</span><span class="ds">封锁 · 禁 · 护 <kbd>3</kbd></span>
  </button>
  <button class="plate pen bp" id="bpBtn">
    <span class="ico-svg" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M8 14h8M8 14l4-5 4 5M12 9v5"/></svg></span>
    <span class="nm">图纸</span><span class="ds" id="bpDs">火塘 · 窝棚 · 祭坛 <kbd>4</kbd></span>
  </button>
  <button class="plate pen tech" id="techBtn">
    <span class="ico-svg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h10"/><circle cx="18" cy="18" r="1.6"/></svg></span>
    <span class="nm">技艺</span><span class="ds">琢磨 · 传手艺 <kbd>T</kbd></span>
  </button>
</div>

<div class="hud plate hint" id="hint"></div>
<div id="pops"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="over" id="over" hidden></div>
<script type="module" src="src/game/main.js"></script>
</body>
</html>
